# The service plus Prometheus (scrapes /metrics every 5 s) and Grafana (a ready-made dashboard).
#   docker compose up --build      then open http://localhost:3000 (Grafana, anonymous viewer)
services:
  api:
    build: .
    ports: ["8000:8000"]
    deploy:
      resources:
        limits: {cpus: "2", memory: 1g}
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/lesion.json
    volumes: ["./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]
